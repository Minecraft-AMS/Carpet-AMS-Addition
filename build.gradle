plugins {
	id("maven-publish")
	id("com.github.hierynomus.license").version("${hierynomus_license_version}").apply(false)
	id("net.fabricmc.fabric-loom").version("${fabric_loom_version}").apply(false)
	id("net.fabricmc.fabric-loom-remap").version("${fabric_loom_remap_version}").apply(false)
	id("com.replaymod.preprocess").version("${preprocess_version}")
}

preprocess {
	preprocess.strictExtraMappings.set(false)

	def mc12108 = createNode('1.21.8', 1_21_08, '')
	def mc12111 = createNode('1.21.11', 1_21_11, '')
	def mc260100 = createNode('26.1', 26_01_00, '')
	def mc260101 = createNode('26.1.1', 26_01_01, '')

    mc12111.link(mc12108, file('versions/mapping-1.21.11-1.21.8.txt'))
    mc12111.link(mc260100, file('versions/mapping-1.21.11-26.1.txt'))
    mc260100.link(mc260101, file('versions/mapping-26.1-26.1.1.txt'))
}

tasks.register('buildAndGather') {
	subprojects {
		dependsOn project.tasks.named('build').get()
	}
	doFirst {
		println 'Gathering builds'
		def buildLibs = {
			p -> p.buildDir.toPath().resolve('libs')
		}
		delete fileTree(buildLibs(rootProject)) {
			include '*'
		}
		subprojects {
			copy {
				from(buildLibs(project)) {
					include '*.jar'
					exclude '*-dev.jar', '*-sources.jar'
				}
				into buildLibs(rootProject)
				duplicatesStrategy DuplicatesStrategy.INCLUDE
			}
		}
	}
}
